name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME), so no extra setup step is needed.
      - run: npm install --no-audit --no-fund
      - name: Build the app bundle (opens straight into the mobile app)
        run: npm run build:app
      - name: Create the Android project
        run: npx cap add android
      - name: App icons and splash
        run: node scripts/icons.mjs
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PayShield.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PayShield-apk
          path: PayShield.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PayShield Android v1.0.${{ github.run_number }}
          make_latest: true
          files: PayShield.apk
          body: |
            PayShield prototype for FIN-11 (VK'26, Team V/Slash).
            Install: download PayShield.apk on an Android phone, open it, and allow "install unknown apps" for your browser when asked.
            Demo passcode 1234. Simulated payments, fictional people, synthetic data.
